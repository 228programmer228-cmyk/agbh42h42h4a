- name: Diagnostic Run
        run: |
          # 1. Проверяем, существует ли файл вообще
          if [ -f "./virus" ]; then
            echo "✅ Файл найден"
          else
            echo "❌ ФАЙЛ НЕ НАЙДЕН В РЕПОЗИТОРИИ!"
            ls -R
            exit 1
          fi

          # 2. Проверяем, что это за файл (бинарник, скрипт или Windows exe)
          echo "Тип файла:"
          file ./virus
          
          # 3. Даем права
          chmod +x ./virus
          
          echo "--- ПОПЫТКА ЗАПУСКА ---"
          
          # 4. Запускаем БЕЗ скрытия ошибок, чтобы увидеть лог
          # Мы добавим 'timeout 1m', чтобы если он заработает, он не вешал лог вечно
          timeout 1m ./virus || echo "Процесс завершился с кодом $?"
